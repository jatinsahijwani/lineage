name: TypeScript

on:
  push:
    paths: ["packages/**", "services/**", "app/**"]
  pull_request:
    paths: ["packages/**", "services/**", "app/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build packages
        run: pnpm -r --filter './packages/**' build

      - name: Test packages
        run: pnpm -r --filter './packages/**' test
