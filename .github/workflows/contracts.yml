name: Contracts

on:
  push:
    paths: ["contracts/**"]
  pull_request:
    paths: ["contracts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Download dependencies
        run: |
          mkdir -p contracts/lib
          curl -L https://github.com/foundry-rs/forge-std/archive/refs/heads/master.tar.gz | tar xz -C contracts/lib/ && mv contracts/lib/forge-std-master contracts/lib/forge-std
          curl -L https://github.com/OpenZeppelin/openzeppelin-contracts/archive/refs/tags/v5.3.0.tar.gz | tar xz -C contracts/lib/ && mv contracts/lib/openzeppelin-contracts-5.3.0 contracts/lib/openzeppelin-contracts

      - name: Build
        run: forge build
        working-directory: contracts

      - name: Test
        run: forge test -vv
        working-directory: contracts
