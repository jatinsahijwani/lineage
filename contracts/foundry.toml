[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
zg_testnet = "${ZERO_G_RPC_URL}"

[etherscan]
zg_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://chainscan-newton.0g.ai/api" }
